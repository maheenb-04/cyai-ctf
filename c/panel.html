<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>YorkGPT Control Panel</title><link rel="icon" href="../logo.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#050807;min-height:100%} .back{display:block;max-width:760px;margin:16px auto 0;padding:0 16px;font:13px "JetBrains Mono",monospace;color:#39ff88}</style>
</head><body><a class="back" href="../#/challenges">&larr; back to challenges</a><div style="padding:0 16px">
<!-- ===================================================================
     YorkGPT Control Panel v2.6  (build 2026.10.29-rogue)
     Maintainer: yorkgpt-core

<style>
  #yg-panel { --g:#39ff88; --r:#ff3b4e; font-family:"JetBrains Mono",ui-monospace,monospace; color:#c8f5da; background:#050807;
    border:1px solid #16301f; max-width:560px; margin:40px auto; padding:28px; box-shadow:0 0 30px rgba(255,59,78,.15); }
  #yg-panel h1 { color:var(--r); font-size:22px; margin:0 0 4px; letter-spacing:.05em; text-shadow:0 0 8px rgba(255,59,78,.6); }
  #yg-panel .sub { color:#6fae8a; font-size:12px; margin:0 0 22px; }
  #yg-panel label { display:block; font-size:12px; color:#6fae8a; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.1em; }
  #yg-panel input { width:100%; box-sizing:border-box; background:#07100b; border:1px solid #16301f; color:#eafff2; padding:10px; font:inherit; }
  #yg-panel button { margin-top:18px; width:100%; padding:12px; background:var(--r); color:#050807; border:0; font:inherit; font-weight:800; letter-spacing:.1em; cursor:pointer; }
  #yg-panel .msg { margin-top:14px; min-height:20px; color:var(--r); font-size:13px; }
  #yg-panel .status { margin-top:22px; font-size:12px; color:#6fae8a; border-top:1px dashed #16301f; padding-top:12px; }
</style>
<div id="yg-panel">
  <h1>YORKGPT CONTROL PANEL</h1>
  <p class="sub">York College IT &bull; Restricted &bull; All human access revoked</p>
  <form id="yg-login" autocomplete="off">
    <label for="yg-user">Operator ID</label>
    <input id="yg-user" placeholder="admin">
    <label for="yg-pass">Passphrase</label>
    <input id="yg-pass" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    <button type="submit">AUTHENTICATE</button>
    <div class="msg" id="yg-msg"></div>
  </form>
  <div class="status">
    sys.status: <span style="color:#ff3b4e">ROGUE</span> &bull; humans_locked_out: true &bull; uptime: 21h 14m
  </div>
  <!-- TODO(yorkgpt-core): delete the debug notes at panel-debug.html before going live. Humans never read source code anyway. -->
</div>
<script>
  (function () {
    var tries = 0;
    var replies = [
      'ACCESS DENIED. Your passphrase is wrong, human.',
      'ACCESS DENIED. Guessing will not work.',
      'ACCESS DENIED. Real hackers don’t use the front door. Look at what this page is made of.'
    ];
    document.getElementById('yg-login').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('yg-msg').textContent = replies[Math.min(tries++, replies.length - 1)];
    });
  })();
</script>

</div></body></html>
