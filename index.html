            <p>Every fragment it left behind contains a <span class="text-neon">flag</span>. Work as a team across web exploitation, forensics, OSINT and password cracking to capture them and rebuild its kill-switch.</p>

        <div class="space-y-3">
          <details class="group bg-void border border-line p-5"><summary class="cursor-pointer list-none flex justify-between items-center gap-3 font-semibold text-neon">What is a Capture The Flag (CTF)?<span class="text-alert group-open:rotate-45 transition">+</span></summary><p class="mt-3 mb-0 text-sm text-neon/70">A cybersecurity competition made of puzzles. Each puzzle hides a secret string called a &ldquo;flag.&rdquo; Find it, submit it, earn points.</p></details>
